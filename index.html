<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Motorun Rotası | M.Gör</title>

  <meta name="description"
        content="Motorun Rotası - Yol, yalnızlık ve özgürlük. Instagram'da kesitler, hikayenin tamamı YouTube'da.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND SLIDESHOW
    ========================== */

    .backgrounds {
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      background: #050505;
    }

    .bg {
      position: absolute;
      inset: -4%;
      background-position: center;
      background-size: cover;
      opacity: 0;
      transform: scale(1.06);
      animation: backgroundFade 21s infinite;
    }

    .bg1 {
      background-image: url("3.PNG");
      animation-delay: 0s;
    }

    .bg2 {
      background-image: url("2.jpg");
      animation-delay: 7s;
    }

    .bg3 {
      background-image: url("1.jpg");
      animation-delay: 14s;
    }

    @keyframes backgroundFade {
      0% {
        opacity: 0;
        transform: scale(1.06);
      }

      8% {
        opacity: 1;
      }

      28% {
        opacity: 1;
        transform: scale(1.12);
      }

      38% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.48) 0%,
          rgba(0,0,0,.65) 45%,
          rgba(0,0,0,.88) 100%
        );
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(0,0,0,.55) 100%
        );
    }

    /* =========================
       PAGE
    ========================== */

    .page {
      min-height: 100vh;
      width: 100%;

      display: flex;
      justify-content: center;

      padding:
        max(38px, env(safe-area-inset-top))
        18px
        35px;
    }

    .container {
      width: 100%;
      max-width: 510px;
      text-align: center;
    }

    /* =========================
       PROFILE
    ========================== */

    .profile-photo-wrap {
      width: 116px;
      height: 116px;
      margin: 0 auto 17px;
      padding: 3px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #777,
          #111
        );

      box-shadow:
        0 12px 40px rgba(0,0,0,.55);
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;

      border: 3px solid #080808;
    }

    h1 {
      font-size: 31px;
      line-height: 1.1;
      letter-spacing: -.7px;
      font-weight: 800;
    }

    .handle {
      margin-top: 7px;
      color: rgba(255,255,255,.63);
      font-size: 14px;
    }

    .motto {
      margin-top: 18px;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.6px;

      color: rgba(255,255,255,.93);
    }

    .bio {
      max-width: 400px;
      margin: 12px auto 27px;

      font-size: 14px;
      line-height: 1.6;

      color: rgba(255,255,255,.72);
    }

    .bio strong {
      color: #fff;
    }

    /* =========================
       LINKS
    ========================== */

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      position: relative;

      min-height: 64px;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 15px 58px;

      color: white;
      text-decoration: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(25,25,25,.76),
          rgba(10,10,10,.78)
        );

      border: 1px solid rgba(255,255,255,.16);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.25);

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .link:hover {
      transform: translateY(-3px);

      border-color: rgba(255,255,255,.45);

      background:
        linear-gradient(
          135deg,
          rgba(42,42,42,.9),
          rgba(15,15,15,.9)
        );

      box-shadow:
        0 15px 40px rgba(0,0,0,.45);
    }

    .icon {
      position: absolute;
      left: 20px;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 25px;
      height: 25px;
      fill: currentColor;
    }

    .link-text {
      text-align: center;
    }

    .link-title {
      font-size: 16px;
      font-weight: 700;
    }

    .link-subtitle {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,.54);
    }

    /* YouTube featured */

    .youtube {
      min-height: 72px;

      background:
        linear-gradient(
          135deg,
          rgba(190,0,0,.93),
          rgba(105,0,0,.88)
        );

      border-color: rgba(255,80,80,.40);

      box-shadow:
        0 12px 35px rgba(180,0,0,.22);
    }

    .youtube:hover {
      background:
        linear-gradient(
          135deg,
          rgba(225,0,0,.98),
          rgba(130,0,0,.95)
        );

      border-color: rgba(255,120,120,.65);

      box-shadow:
        0 15px 45px rgba(190,0,0,.34);
    }

    /* =========================
       SMALL SOCIAL BAR
    ========================== */

    .social-small {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;

      margin-top: 27px;
    }

    .social-small a {
      color: rgba(255,255,255,.58);
      transition: .2s ease;
    }

    .social-small a:hover {
      color: white;
      transform: translateY(-2px);
    }

    .social-small svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: rgba(255,255,255,.35);
      letter-spacing: .4px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .page {
        padding-top: 30px;
      }

      .profile-photo-wrap {
        width: 103px;
        height: 103px;
      }

      h1 {
        font-size: 27px;
      }

      .motto {
        font-size: 13px;
      }

      .bio {
        font-size: 13px;
      }

      .link {
        min-height: 60px;
        border-radius: 16px;
      }

      .youtube {
        min-height: 67px;
      }

      .bg1 {
        background-position: 55% center;
      }

      .bg2 {
        background-position: 56% center;
      }

      .bg3 {
        background-position: 53% center;
      }
    }

    /* Daha az hareket isteyen kullanıcılar */

    @media (prefers-reduced-motion: reduce) {
      .bg {
        animation: none;
      }

      .bg1 {
        opacity: 1;
      }

      .link {
        transition: none;
      }
    }

  </style>
</head>
