* {margin:0;padding:0;box-sizing:border-box}
html,body {min-height:100%}
body {isolation:isolate;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff;overflow-x:hidden}
.backgrounds {pointer-events:none;position:fixed;inset:0;z-index:0;overflow:hidden;background:#050505}
/* The first scene remains opaque underneath the two fading scenes.
   Scene 2 resets only after scene 3 covers it, avoiding black gaps. */
.bg {position:absolute;inset:-4%;background-position:center;background-size:cover;transform:scale(1.06);opacity:0}
.bg1 {background-image:url("3.PNG");opacity:1}
.bg2 {background-image:url("2.jpg");animation:sceneTwo 21s linear infinite}
.bg3 {background-image:url("1.jpg");animation:sceneThree 21s linear infinite}
@keyframes sceneTwo {
  0%,25% {opacity:0}
  33.333%,66.667% {opacity:1}
  66.668%,100% {opacity:0}
}
@keyframes sceneThree {
  0%,58.333% {opacity:0}
  66.667%,91.667% {opacity:1}
  100% {opacity:0}
}
.backgrounds.is-paused .bg {animation-play-state:paused}
.overlay {pointer-events:none;position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.48) 0%,rgba(0,0,0,.65) 45%,rgba(0,0,0,.88) 100%)}
.vignette {position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at center,transparent 20%,rgba(0,0,0,.55) 100%)}
.page {position:relative;z-index:3;min-height:100vh;min-height:100svh;width:100%;display:flex;justify-content:center;padding:max(38px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(35px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}

.profile-photo {width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:left center;display:block;border:3px solid #080808}
h1 {font-size:31px;line-height:1.1;letter-spacing:-.7px;font-weight:800}
.handle {margin-top:7px;color:rgba(255,255,255,.63);font-size:14px}

.link:hover {transform:translateY(-3px);border-color:rgba(255,255,255,.45);background:linear-gradient(135deg,rgba(42,42,42,.9),rgba(15,15,15,.9));box-shadow:0 15px 40px rgba(0,0,0,.45)}
.icon {position:absolute;left:20px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.icon svg {width:25px;height:25px;fill:currentColor}
.link-text {text-align:center}
.link-title {font-size:16px;font-weight:700}
.link-subtitle {margin-top:3px;font-size:11px;font-weight:400;color:rgba(255,255,255,.80)}
.youtube {min-height:72px;background:linear-gradient(135deg,rgba(190,0,0,.93),rgba(105,0,0,.88));border-color:rgba(255,80,80,.40);box-shadow:0 12px 35px rgba(180,0,0,.22)}
.youtube:hover {background:linear-gradient(135deg,rgba(225,0,0,.98),rgba(130,0,0,.95));border-color:rgba(255,120,120,.65);box-shadow:0 15px 45px rgba(190,0,0,.34)}
.social-small {display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px}
.social-small a {width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:rgba(255,255,255,.58);transition:.2s ease}
.social-small a:hover {color:white;transform:translateY(-2px)}
.social-small svg {width:20px;height:20px;fill:currentColor}
footer {margin-top:24px;font-size:11px;color:rgba(255,255,255,.60);letter-spacing:.4px}
@media(max-width:600px) {

 .bg1 {background-position:55% center}

 .bg3 {background-position:53% center}
}
@media(prefers-reduced-motion:reduce) {

.link:focus-visible,.social-small a:focus-visible,.motion-toggle:focus-visible {

.motion-toggle {display:inline-flex;align-items:center;justify-content:center;

.motion-toggle[hidden] {display:none}

@media(max-width:360px) {

@media(prefers-reduced-motion:reduce) {

 .link:hover,.social-small a:hover {transform:none}
}

<script>
/* The links do not depend on JavaScript. This button only pauses the backdrop. */
(() => {
  const button = document.getElementById('background-control');
  const backdrop = document.querySelector('.backgrounds');
  if (!button || !backdrop) return;
  button.hidden = false;
  button.addEventListener('click', () => {
    const paused = backdrop.classList.toggle('is-paused');
    button.setAttribute('aria-pressed', String(paused));
    button.textContent = paused ? 'Arka planı oynat' : 'Arka planı duraklat';
  });
})();
</script>
